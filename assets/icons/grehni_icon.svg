<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- House roof / triangle -->
  <polyline points="10,50 50,10 90,50" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Left wall -->
  <line x1="20" y1="43" x2="20" y2="80" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <!-- Right wall -->
  <line x1="80" y1="43" x2="80" y2="80" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <!-- Bottom base -->
  <line x1="20" y1="80" x2="80" y2="80" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <!-- Door / entrance arch -->
  <path d="M42,80 L42,62 Q50,54 58,62 L58,80" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Dot below -->
  <circle cx="50" cy="92" r="4" fill="white"/>
</svg>
