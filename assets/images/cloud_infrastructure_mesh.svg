<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cloud-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07130b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020704" stop-opacity="0.98"/>
    </linearGradient>
    <radialGradient id="region-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E575" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00E575" stop-opacity="0"/>
    </radialGradient>
    <filter id="cloud-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect x="10" y="10" width="780" height="480" rx="20" fill="url(#cloud-bg)" stroke="#00E575" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Top Status Bar -->
  <rect x="10" y="10" width="780" height="42" rx="20" fill="#040906" stroke="#00E575" stroke-opacity="0.15" stroke-width="1"/>
  <circle cx="36" cy="31" r="5" fill="#FF5F56"/>
  <circle cx="54" cy="31" r="5" fill="#FFBD2E"/>
  <circle cx="72" cy="31" r="5" fill="#27C93F"/>
  <text x="105" y="35" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" letter-spacing="1">GREHNI GLOBAL CLOUD FLEET ORCHESTRATION &amp; TELEMETRY</text>
  <rect x="670" y="21" width="100" height="20" rx="10" fill="#00E575" fill-opacity="0.12" stroke="#00E575" stroke-width="1"/>
  <text x="720" y="35" fill="#00E575" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">500M+ MSGS/D</text>

  <!-- Central Cloud Ingestion Hub -->
  <circle cx="400" cy="250" r="95" fill="url(#region-glow)"/>
  <circle cx="400" cy="250" r="70" fill="#06180c" stroke="#00E575" stroke-width="2" filter="url(#cloud-glow)"/>
  <text x="400" y="240" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" text-anchor="middle">GREHNI CLOUD</text>
  <text x="400" y="258" fill="#00E575" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">KAFKA MESH</text>
  <text x="400" y="274" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Predictive Refill ML</text>

  <!-- Regional Clusters -->
  <!-- Region 1: Mumbai (ap-south-1) -->
  <g transform="translate(130, 110)">
    <rect x="0" y="0" width="170" height="75" rx="12" fill="#08180e" stroke="#00E575" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="16" cy="22" r="4" fill="#00E575"/>
    <text x="28" y="25" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Mumbai (ap-south-1)</text>
    <text x="14" y="46" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Active Nodes: 12,480</text>
    <text x="14" y="62" fill="#00E575" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">RTT: 8ms · 99.99% Up</text>
  </g>
  <line x1="300" y1="147" x2="350" y2="210" stroke="#00E575" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Region 2: Singapore (ap-southeast-1) -->
  <g transform="translate(500, 110)">
    <rect x="0" y="0" width="170" height="75" rx="12" fill="#08180e" stroke="#00E575" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="16" cy="22" r="4" fill="#00E575"/>
    <text x="28" y="25" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Singapore (ap-se-1)</text>
    <text x="14" y="46" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Active Nodes: 6,190</text>
    <text x="14" y="62" fill="#00E575" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">RTT: 19ms · 99.99% Up</text>
  </g>
  <line x1="500" y1="147" x2="450" y2="210" stroke="#00E575" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Region 3: Frankfurt (eu-central-1) -->
  <g transform="translate(130, 320)">
    <rect x="0" y="0" width="170" height="75" rx="12" fill="#08180e" stroke="#00E575" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="16" cy="22" r="4" fill="#00E575"/>
    <text x="28" y="25" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Frankfurt (eu-west-1)</text>
    <text x="14" y="46" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Active Nodes: 8,420</text>
    <text x="14" y="62" fill="#00E575" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">RTT: 24ms · 99.99% Up</text>
  </g>
  <line x1="300" y1="357" x2="350" y2="290" stroke="#00E575" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Region 4: US-East (us-east-1) -->
  <g transform="translate(500, 320)">
    <rect x="0" y="0" width="170" height="75" rx="12" fill="#08180e" stroke="#00E575" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="16" cy="22" r="4" fill="#00E575"/>
    <text x="28" y="25" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">US-East (us-east-1)</text>
    <text x="14" y="46" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Active Nodes: 14,830</text>
    <text x="14" y="62" fill="#00E575" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">RTT: 31ms · 99.99% Up</text>
  </g>
  <line x1="500" y1="357" x2="450" y2="290" stroke="#00E575" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Bottom Metric Callouts -->
  <text x="400" y="445" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">ENTERPRISE SLA GUARANTEE</text>
  <text x="400" y="465" fill="#00E575" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-anchor="middle">99.99% Global Uptime · Automated 14-Day Refill Logistics · SOC2 Type II Certified</text>
</svg>
