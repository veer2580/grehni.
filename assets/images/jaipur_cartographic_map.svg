<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <radialGradient id="mapGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E575" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#00E575" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#060a08" stop-opacity="0"/>
    </radialGradient>
    <pattern id="streetGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Dark Base -->
  <rect width="100%" height="100%" fill="#070c09" rx="24"/>
  <rect width="100%" height="100%" fill="url(#streetGrid)" rx="24"/>
  <rect width="100%" height="100%" fill="url(#mapGlow)" rx="24"/>

  <!-- Concentric Orbital Arteries -->
  <circle cx="400" cy="240" r="70" fill="none" stroke="rgba(0, 229, 117, 0.16)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="400" cy="240" r="140" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1.2"/>
  <circle cx="400" cy="240" r="210" fill="none" stroke="rgba(0, 229, 117, 0.08)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="400" cy="240" r="280" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>

  <!-- Radial Arterial Roads (Jaipur Major Arteries) -->
  <g stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5">
    <line x1="400" y1="240" x2="400" y2="20" />
    <line x1="400" y1="240" x2="400" y2="460" />
    <line x1="400" y1="240" x2="20" y2="240" />
    <line x1="400" y1="240" x2="780" y2="240" />
    <line x1="400" y1="240" x2="130" y2="70" />
    <line x1="400" y1="240" x2="670" y2="70" />
    <line x1="400" y1="240" x2="130" y2="410" />
    <line x1="400" y1="240" x2="670" y2="410" />
  </g>

  <!-- Secondary City Road Grid -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="220" y1="40" x2="220" y2="440" />
    <line x1="580" y1="40" x2="580" y2="440" />
    <line x1="60" y1="130" x2="740" y2="130" />
    <line x1="60" y1="350" x2="740" y2="350" />
    <line x1="310" y1="60" x2="490" y2="420" />
    <line x1="490" y1="60" x2="310" y2="420" />
  </g>

  <!-- Connected Green Network Lines -->
  <g stroke="#00E575" stroke-width="1.6" opacity="0.45">
    <path d="M 400 240 L 260 140 L 150 160" fill="none"/>
    <path d="M 400 240 L 540 140 L 650 110" fill="none"/>
    <path d="M 400 240 L 280 320 L 180 360" fill="none"/>
    <path d="M 400 240 L 510 320 L 630 360" fill="none"/>
  </g>
</svg>
