<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="edge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07140b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020604" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="chip-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14261b"/>
      <stop offset="50%" stop-color="#0a170f"/>
      <stop offset="100%" stop-color="#050d08"/>
    </linearGradient>
    <linearGradient id="bus-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E575"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="edge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect x="10" y="10" width="780" height="480" rx="20" fill="url(#edge-bg)" stroke="#00E575" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Top Status Bar -->
  <rect x="10" y="10" width="780" height="42" rx="20" fill="#040906" stroke="#00E575" stroke-opacity="0.15" stroke-width="1"/>
  <circle cx="36" cy="31" r="5" fill="#FF5F56"/>
  <circle cx="54" cy="31" r="5" fill="#FFBD2E"/>
  <circle cx="72" cy="31" r="5" fill="#27C93F"/>
  <text x="105" y="35" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" letter-spacing="1">GREHNI NEURAL EDGE UNIT (G-NEU) — SILICON ARCHITECTURE</text>
  <rect x="670" y="21" width="100" height="20" rx="10" fill="#00E575" fill-opacity="0.12" stroke="#00E575" stroke-width="1"/>
  <text x="720" y="35" fill="#00E575" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">EDGE 4.2ms</text>

  <!-- Circuit Trace Lines on PCB -->
  <g stroke="#00E575" stroke-opacity="0.18" stroke-width="1.5" fill="none">
    <!-- Left bus lines -->
    <path d="M 60 140 L 180 140 L 250 200 L 300 200"/>
    <path d="M 60 250 L 300 250"/>
    <path d="M 60 360 L 180 360 L 250 300 L 300 300"/>
    <!-- Right bus lines -->
    <path d="M 500 200 L 550 200 L 620 140 L 740 140"/>
    <path d="M 500 250 L 740 250"/>
    <path d="M 500 300 L 550 300 L 620 360 L 740 360"/>
  </g>

  <!-- Central Microprocessor Package (G-NEU) -->
  <g transform="translate(300, 150)">
    <!-- Chip Outer Ring Pins -->
    <rect x="-10" y="-10" width="220" height="220" rx="16" fill="#020804" stroke="#00E575" stroke-opacity="0.4" stroke-width="2"/>
    <!-- Chip Die -->
    <rect x="10" y="10" width="180" height="180" rx="12" fill="url(#chip-metal)" stroke="#00E575" stroke-width="2" filter="url(#edge-glow)"/>
    
    <!-- Core Grid -->
    <rect x="25" y="25" width="65" height="65" rx="6" fill="#05150a" stroke="#10B981" stroke-opacity="0.5" stroke-width="1"/>
    <text x="57" y="55" fill="#00E575" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">NPU CORE 0</text>
    <text x="57" y="70" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" text-anchor="middle">VOC Model</text>

    <rect x="110" y="25" width="65" height="65" rx="6" fill="#05150a" stroke="#10B981" stroke-opacity="0.5" stroke-width="1"/>
    <text x="142" y="55" fill="#00E575" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">NPU CORE 1</text>
    <text x="142" y="70" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" text-anchor="middle">CFD Vector</text>

    <rect x="25" y="110" width="65" height="65" rx="6" fill="#05150a" stroke="#10B981" stroke-opacity="0.5" stroke-width="1"/>
    <text x="57" y="140" fill="#00E575" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">SRAM 4MB</text>
    <text x="57" y="155" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" text-anchor="middle">Zero-Bus Latency</text>

    <rect x="110" y="110" width="65" height="65" rx="6" fill="#05150a" stroke="#10B981" stroke-opacity="0.5" stroke-width="1"/>
    <text x="142" y="140" fill="#00E575" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">SECURE ENCLAVE</text>
    <text x="142" y="155" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" text-anchor="middle">Local Privacy</text>
  </g>

  <!-- Left Sensors (Input Array) -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="130" height="60" rx="10" fill="#07170c" stroke="#00E575" stroke-width="1.2"/>
    <text x="15" y="25" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">MEMS Gas Array</text>
    <text x="15" y="45" fill="#00E575" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">TVOC: 142 ppb</text>
  </g>
  <g transform="translate(60, 220)">
    <rect x="0" y="0" width="130" height="60" rx="10" fill="#07170c" stroke="#00E575" stroke-width="1.2"/>
    <text x="15" y="25" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Laser Particulate</text>
    <text x="15" y="45" fill="#00E575" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">PM2.5: 8.4 µg/m³</text>
  </g>
  <g transform="translate(60, 330)">
    <rect x="0" y="0" width="130" height="60" rx="10" fill="#07170c" stroke="#00E575" stroke-width="1.2"/>
    <text x="15" y="25" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Ultrasonic Airflow</text>
    <text x="15" y="45" fill="#00E575" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Flow: 0.38 m/s</text>
  </g>

  <!-- Right Actuators (Output Control) -->
  <g transform="translate(610, 110)">
    <rect x="0" y="0" width="130" height="60" rx="10" fill="#07170c" stroke="#10B981" stroke-width="1.2"/>
    <text x="15" y="25" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Aroma Diffuser 01</text>
    <text x="15" y="45" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Active: 65% Pulse</text>
  </g>
  <g transform="translate(610, 220)">
    <rect x="0" y="0" width="130" height="60" rx="10" fill="#07170c" stroke="#10B981" stroke-width="1.2"/>
    <text x="15" y="25" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">HVAC Damper Sync</text>
    <text x="15" y="45" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Modulation: 12°</text>
  </g>
  <g transform="translate(610, 330)">
    <rect x="0" y="0" width="130" height="60" rx="10" fill="#07170c" stroke="#10B981" stroke-width="1.2"/>
    <text x="15" y="25" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Mesh Gateway</text>
    <text x="15" y="45" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">AES-256 Link OK</text>
  </g>

  <!-- Bottom Metric Callouts -->
  <text x="400" y="425" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle">ON-DEVICE INFERENCE ENGINE</text>
  <text x="400" y="445" fill="#00E575" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-anchor="middle">4.2ms Decision Latency · 0% Cloud Data Leakage · 100% On-Premises Privacy</text>
</svg>
