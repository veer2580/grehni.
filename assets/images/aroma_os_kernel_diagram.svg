<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="os-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1f14" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#030805" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E575" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00E575" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E575" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00E575" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop Shadow Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas Card -->
  <rect x="10" y="10" width="780" height="480" rx="20" fill="url(#os-card-bg)" stroke="#00E575" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Top Terminal Bar -->
  <rect x="10" y="10" width="780" height="42" rx="20" fill="#040906" stroke="#00E575" stroke-opacity="0.15" stroke-width="1"/>
  <circle cx="36" cy="31" r="5" fill="#FF5F56"/>
  <circle cx="54" cy="31" r="5" fill="#FFBD2E"/>
  <circle cx="72" cy="31" r="5" fill="#27C93F"/>
  <text x="105" y="35" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" letter-spacing="1">AROMA OS 4.2 KERNEL ARCHITECTURE &amp; DISPERSION PIPELINE</text>
  <rect x="680" y="21" width="90" height="20" rx="10" fill="#00E575" fill-opacity="0.12" stroke="#00E575" stroke-width="1"/>
  <circle cx="692" cy="31" r="3" fill="#00E575" filter="url(#neon-glow)"/>
  <text x="702" y="35" fill="#00E575" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">SYS_ONLINE</text>

  <!-- Grid Pattern Overlay -->
  <g stroke="#00E575" stroke-opacity="0.04" stroke-width="1">
    <line x1="10" y1="120" x2="790" y2="120"/>
    <line x1="10" y1="200" x2="790" y2="200"/>
    <line x1="10" y1="280" x2="790" y2="280"/>
    <line x1="10" y1="360" x2="790" y2="360"/>
    <line x1="10" y1="440" x2="790" y2="440"/>
    <line x1="200" y1="52" x2="200" y2="490"/>
    <line x1="400" y1="52" x2="400" y2="490"/>
    <line x1="600" y1="52" x2="600" y2="490"/>
  </g>

  <!-- Central Processing Core Node -->
  <circle cx="400" cy="270" r="110" fill="url(#node-glow)"/>
  <circle cx="400" cy="270" r="75" fill="#051209" stroke="#00E575" stroke-width="2" filter="url(#neon-glow)"/>
  <circle cx="400" cy="270" r="55" fill="#020704" stroke="#10B981" stroke-dasharray="4,4" stroke-width="1.5"/>
  <text x="400" y="265" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" text-anchor="middle">AROMA KERNEL</text>
  <text x="400" y="283" fill="#00E575" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-anchor="middle">v4.2.8 RTOS</text>

  <!-- Surrounding Subsystems (Connected by glowing data buses) -->
  <!-- 1. Scent Scheduler -->
  <g transform="translate(110, 110)">
    <rect x="0" y="0" width="160" height="74" rx="12" fill="#06120a" stroke="#00E575" stroke-opacity="0.3" stroke-width="1.2"/>
    <rect x="12" y="14" width="8" height="8" rx="2" fill="#00E575"/>
    <text x="28" y="22" fill="#F1F5F9" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Olfactory Scheduler</text>
    <text x="14" y="44" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Anti-Fatigue Pulse</text>
    <text x="14" y="58" fill="#00E575" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">Jitter: 1.8ms (Realtime)</text>
  </g>
  <path d="M270 147 L345 225" stroke="#00E575" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="3,3"/>

  <!-- 2. Fluid Dynamics Simulation -->
  <g transform="translate(530, 110)">
    <rect x="0" y="0" width="160" height="74" rx="12" fill="#06120a" stroke="#00E575" stroke-opacity="0.3" stroke-width="1.2"/>
    <rect x="12" y="14" width="8" height="8" rx="2" fill="#10B981"/>
    <text x="28" y="22" fill="#F1F5F9" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">CFD Dynamics</text>
    <text x="14" y="44" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Room Airflow Modeling</text>
    <text x="14" y="58" fill="#00E575" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">Velocity: 0.42 m/s</text>
  </g>
  <path d="M530 147 L455 225" stroke="#00E575" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="3,3"/>

  <!-- 3. Micro-Droplet Actuator -->
  <g transform="translate(110, 360)">
    <rect x="0" y="0" width="160" height="74" rx="12" fill="#06120a" stroke="#00E575" stroke-opacity="0.3" stroke-width="1.2"/>
    <rect x="12" y="14" width="8" height="8" rx="2" fill="#00E575"/>
    <text x="28" y="22" fill="#F1F5F9" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Piezo Actuator</text>
    <text x="14" y="44" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Cold Ultrasonic Vapor</text>
    <text x="14" y="58" fill="#00E575" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">Droplet &lt; 0.8 Micron</text>
  </g>
  <path d="M270 397 L345 315" stroke="#00E575" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="3,3"/>

  <!-- 4. Multi-Zone Orchestration -->
  <g transform="translate(530, 360)">
    <rect x="0" y="0" width="160" height="74" rx="12" fill="#06120a" stroke="#00E575" stroke-opacity="0.3" stroke-width="1.2"/>
    <rect x="12" y="14" width="8" height="8" rx="2" fill="#10B981"/>
    <text x="28" y="22" fill="#F1F5F9" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Mesh Sync</text>
    <text x="14" y="44" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">BLE Mesh &amp; Thread</text>
    <text x="14" y="58" fill="#00E575" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">Up to 256 Nodes Sync</text>
  </g>
  <path d="M530 397 L455 315" stroke="#00E575" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="3,3"/>

  <!-- Orbiting Molecular Data Particles -->
  <circle cx="340" cy="200" r="4" fill="#00E575" filter="url(#neon-glow)"/>
  <circle cx="460" cy="210" r="3.5" fill="#10B981"/>
  <circle cx="450" cy="335" r="4" fill="#00E575" filter="url(#neon-glow)"/>
  <circle cx="355" cy="325" r="3" fill="#00E575"/>

  <!-- Waveform Indicator at bottom -->
  <path d="M 320 460 Q 360 445 400 460 T 480 460" fill="none" stroke="url(#emerald-glow)" stroke-width="2.5" filter="url(#neon-glow)"/>
  <text x="400" y="480" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">REALTIME OLFACTORY OSCILLATION FREQUENCY: 128 Hz</text>
</svg>
