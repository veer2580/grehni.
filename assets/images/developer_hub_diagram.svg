<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dev-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08150d" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030805" stop-opacity="0.98"/>
    </linearGradient>
    <filter id="dev-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect x="10" y="10" width="780" height="480" rx="20" fill="url(#dev-bg)" stroke="#00E575" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Top Status Bar -->
  <rect x="10" y="10" width="780" height="42" rx="20" fill="#040906" stroke="#00E575" stroke-opacity="0.15" stroke-width="1"/>
  <circle cx="36" cy="31" r="5" fill="#FF5F56"/>
  <circle cx="54" cy="31" r="5" fill="#FFBD2E"/>
  <circle cx="72" cy="31" r="5" fill="#27C93F"/>
  <text x="105" y="35" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" letter-spacing="1">GREHNI DEVELOPER ECOSYSTEM &amp; SCIENTIFIC RESEARCH ARCHIVE</text>
  <rect x="670" y="21" width="100" height="20" rx="10" fill="#00E575" fill-opacity="0.12" stroke="#00E575" stroke-width="1"/>
  <text x="720" y="35" fill="#00E575" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">API v2.4 DOCS</text>

  <!-- Left Column: Code Window -->
  <g transform="translate(45, 80)">
    <rect x="0" y="0" width="340" height="340" rx="14" fill="#040c07" stroke="#00E575" stroke-opacity="0.3" stroke-width="1.2"/>
    <rect x="0" y="0" width="340" height="32" rx="14" fill="#06160d"/>
    <text x="16" y="21" fill="#64748B" font-family="'Courier New', monospace" font-size="11">ambient_dispersion.py</text>
    <rect x="255" y="8" width="70" height="18" rx="6" fill="#00E575" fill-opacity="0.1"/>
    <text x="290" y="20" fill="#00E575" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">PYTHON 3.12</text>
    
    <!-- Code Lines -->
    <text x="16" y="65" fill="#00E575" font-family="'Courier New', monospace" font-size="11">import</text>
    <text x="65" y="65" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="11">grehni_os</text>
    
    <text x="16" y="95" fill="#64748B" font-family="'Courier New', monospace" font-size="11"># Initialize secure local gateway</text>
    <text x="16" y="115" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="11">client = grehni_os.Client(</text>
    <text x="32" y="135" fill="#94A3B8" font-family="'Courier New', monospace" font-size="11">zone_id=<text fill="#10B981">"hq-boardroom-a"</text>,</text>
    <text x="32" y="155" fill="#94A3B8" font-family="'Courier New', monospace" font-size="11">profile=<text fill="#10B981">"alpha_cedarwood"</text></text>
    <text x="16" y="175" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="11">)</text>

    <text x="16" y="210" fill="#64748B" font-family="'Courier New', monospace" font-size="11"># Subscribe to live olfactory telemetry</text>
    <text x="16" y="230" fill="#00E575" font-family="'Courier New', monospace" font-size="11">@client.on_sensor_event</text>
    <text x="16" y="250" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="11">def sync_air_quality(event):</text>
    <text x="32" y="270" fill="#94A3B8" font-family="'Courier New', monospace" font-size="11">if event.tvoc &gt; <text fill="#FFBD2E">200</text>:</text>
    <text x="48" y="290" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="11">client.boost_dispersion(</text>
    <text x="64" y="310" fill="#10B981" font-family="'Courier New', monospace" font-size="11">rate_ul_hr=85, pulse_sec=12</text>
    <text x="48" y="330" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="11">)</text>
  </g>

  <!-- Right Column: Scientific & Developer Resources Stack -->
  <g transform="translate(415, 80)">
    <!-- Card 1: Research Paper -->
    <rect x="0" y="0" width="340" height="98" rx="12" fill="#06160d" stroke="#00E575" stroke-opacity="0.35" stroke-width="1.2"/>
    <circle cx="26" cy="28" r="12" fill="#00E575" fill-opacity="0.15"/>
    <path d="M 22 23 L 30 23 M 22 28 L 30 28 M 22 33 L 27 33" stroke="#00E575" stroke-width="1.8"/>
    <text x="48" y="26" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Computational Olfaction (2026)</text>
    <text x="48" y="44" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Neural Models for Spatial Vapor Dynamics</text>
    <text x="48" y="60" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">42 Pages · Peer-Reviewed Research · PDF (3.2 MB)</text>
    <rect x="48" y="70" width="85" height="18" rx="6" fill="#00E575" fill-opacity="0.15"/>
    <text x="90" y="82" fill="#00E575" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">DOWNLOAD ↗</text>

    <!-- Card 2: SDK Ecosystem -->
    <g transform="translate(0, 115)">
      <rect x="0" y="0" width="340" height="98" rx="12" fill="#06160d" stroke="#00E575" stroke-opacity="0.35" stroke-width="1.2"/>
      <circle cx="26" cy="28" r="12" fill="#10B981" fill-opacity="0.15"/>
      <path d="M 22 28 L 26 32 L 31 23" stroke="#10B981" stroke-width="1.8" fill="none"/>
      <text x="48" y="26" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Official SDKs &amp; Webhooks</text>
      <text x="48" y="44" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Python, TypeScript / Node.js, Go, Rust</text>
      <text x="48" y="60" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">pip install grehni-sdk · npm i @grehni/core</text>
      <rect x="48" y="70" width="95" height="18" rx="6" fill="#10B981" fill-opacity="0.15"/>
      <text x="95" y="82" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">VIEW REPO ↗</text>
    </g>

    <!-- Card 3: Safety Standards & IFRA -->
    <g transform="translate(0, 230)">
      <rect x="0" y="0" width="340" height="98" rx="12" fill="#06160d" stroke="#00E575" stroke-opacity="0.35" stroke-width="1.2"/>
      <circle cx="26" cy="28" r="12" fill="#00E575" fill-opacity="0.15"/>
      <circle cx="26" cy="28" r="6" stroke="#00E575" stroke-width="1.5" fill="none"/>
      <text x="48" y="26" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">IFRA Standard 51 &amp; Safety Data</text>
      <text x="48" y="44" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Hypoallergenic &amp; VOC Compliance Dossier</text>
      <text x="48" y="60" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Global Material Safety Data Sheets (MSDS)</text>
      <rect x="48" y="70" width="105" height="18" rx="6" fill="#00E575" fill-opacity="0.15"/>
      <text x="100" y="82" fill="#00E575" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">INSPECT CERT ↗</text>
    </g>
  </g>

  <!-- Bottom Strip -->
  <text x="400" y="455" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">OPEN ARCHITECTURE FOR INTEGRATORS</text>
  <text x="400" y="472" fill="#00E575" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" text-anchor="middle">REST API · WebSocket Streaming · BACnet &amp; Modbus HVAC Connectors · MQTT 5.0</text>
</svg>
