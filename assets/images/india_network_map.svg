<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="map-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00E575" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#041208" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#020604" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="network-line-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E575" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.3"/>
    </linearGradient>
    <!-- Glow Filters -->
    <filter id="emerald-beacon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="line-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="600" rx="20" fill="url(#map-glow)"/>

  <!-- Tech Grid Background -->
  <g stroke="#00E575" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="100" x2="500" y2="100"/>
    <line x1="0" y1="200" x2="500" y2="200"/>
    <line x1="0" y1="300" x2="500" y2="300"/>
    <line x1="0" y1="400" x2="500" y2="400"/>
    <line x1="0" y1="500" x2="500" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
  </g>

  <!-- India Boundary Path (High-Precision Stylized Geographical Silhouette) -->
  <path d="M 215 55 
           C 220 50, 235 52, 245 65 
           L 255 75 L 265 70 L 275 80 L 285 75 L 290 85 L 280 100 L 285 115 
           L 270 135 L 280 145 L 275 160 L 295 165 L 320 170 L 335 165 L 360 170 
           L 380 175 L 400 170 L 420 180 L 440 185 L 460 215 L 450 230 L 435 235 
           L 440 250 L 425 260 L 415 250 L 400 255 L 390 240 L 375 245 L 365 240 
           L 355 255 L 340 260 L 345 275 L 330 285 L 320 280 L 315 300 L 305 320 
           L 295 340 L 290 370 L 275 400 L 265 435 L 255 465 L 245 490 L 235 515 
           L 225 540 L 220 545 L 215 540 L 205 505 L 195 470 L 180 435 L 170 400 
           L 165 370 L 155 345 L 145 325 L 140 310 L 130 305 L 115 310 L 105 295 
           L 95 295 L 90 280 L 100 270 L 115 275 L 125 260 L 120 240 L 105 245 
           L 95 235 L 110 220 L 125 210 L 135 190 L 145 175 L 155 160 L 165 145 
           L 180 135 L 190 120 L 195 100 L 205 85 Z"
        fill="#041208" 
        fill-opacity="0.8" 
        stroke="#00E575" 
        stroke-width="2.2" 
        filter="url(#line-glow)"/>

  <!-- Internal Secondary Regional Contours -->
  <path d="M 215 85 Q 240 120 220 180 T 260 270 T 235 400 T 225 540" 
        fill="none" stroke="#00E575" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M 125 260 Q 200 280 275 270 T 400 255" 
        fill="none" stroke="#00E575" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Constellation Interconnecting Data Lines -->
  <!-- Jaipur (Hub) Connections -->
  <line x1="180" y1="190" x2="215" y2="155" stroke="url(#network-line-grad)" stroke-width="2" filter="url(#line-glow)"/> <!-- Jaipur to Delhi -->
  <line x1="180" y1="190" x2="140" y2="255" stroke="url(#network-line-grad)" stroke-width="2" filter="url(#line-glow)"/> <!-- Jaipur to Ahmedabad -->
  <line x1="180" y1="190" x2="250" y2="245" stroke="url(#network-line-grad)" stroke-width="1.8"/> <!-- Jaipur to Bhopal -->
  <line x1="180" y1="190" x2="270" y2="185" stroke="url(#network-line-grad)" stroke-width="1.8"/> <!-- Jaipur to Lucknow -->
  <line x1="180" y1="190" x2="160" y2="310" stroke="url(#network-line-grad)" stroke-width="2" filter="url(#line-glow)"/> <!-- Jaipur to Mumbai -->

  <!-- Northern Grid -->
  <line x1="215" y1="155" x2="200" y2="115" stroke="#00E575" stroke-width="1.5" stroke-opacity="0.7"/> <!-- Delhi to Chandigarh -->
  <line x1="200" y1="115" x2="230" y2="75" stroke="#00E575" stroke-width="1.5" stroke-opacity="0.7"/> <!-- Chandigarh to Srinagar -->
  <line x1="215" y1="155" x2="270" y2="185" stroke="#00E575" stroke-width="1.5" stroke-opacity="0.7"/> <!-- Delhi to Lucknow -->

  <!-- Western & Central Grid -->
  <line x1="140" y1="255" x2="160" y2="310" stroke="#00E575" stroke-width="2" filter="url(#line-glow)"/> <!-- Ahmedabad to Mumbai -->
  <line x1="160" y1="310" x2="185" y2="335" stroke="#00E575" stroke-width="2" filter="url(#line-glow)"/> <!-- Mumbai to Pune -->
  <line x1="185" y1="335" x2="230" y2="360" stroke="#00E575" stroke-width="1.8"/> <!-- Pune to Hyderabad -->
  <line x1="250" y1="245" x2="265" y2="295" stroke="#00E575" stroke-width="1.5" stroke-opacity="0.7"/> <!-- Bhopal to Nagpur -->
  <line x1="265" y1="295" x2="230" y2="360" stroke="#00E575" stroke-width="1.8"/> <!-- Nagpur to Hyderabad -->

  <!-- Eastern & North-Eastern Grid -->
  <line x1="270" y1="185" x2="315" y2="215" stroke="#00E575" stroke-width="1.5" stroke-opacity="0.7"/> <!-- Lucknow to Patna -->
  <line x1="315" y1="215" x2="335" y2="265" stroke="#00E575" stroke-width="2" filter="url(#line-glow)"/> <!-- Patna to Kolkata -->
  <line x1="315" y1="215" x2="395" y2="200" stroke="#00E575" stroke-width="1.5" stroke-opacity="0.7"/> <!-- Patna to Guwahati -->
  <line x1="395" y1="200" x2="435" y2="220" stroke="#00E575" stroke-width="1.2" stroke-opacity="0.6"/> <!-- Guwahati to East -->
  <line x1="335" y1="265" x2="290" y2="330" stroke="#00E575" stroke-width="1.5" stroke-opacity="0.7"/> <!-- Kolkata to Bhubaneswar -->
  <line x1="290" y1="330" x2="255" y2="405" stroke="#00E575" stroke-width="1.8"/> <!-- Bhubaneswar to Vizag -->

  <!-- Southern Grid -->
  <line x1="230" y1="360" x2="205" y2="440" stroke="#00E575" stroke-width="2" filter="url(#line-glow)"/> <!-- Hyderabad to Bengaluru -->
  <line x1="230" y1="360" x2="255" y2="405" stroke="#00E575" stroke-width="1.8"/> <!-- Hyderabad to Vizag -->
  <line x1="255" y1="405" x2="250" y2="455" stroke="#00E575" stroke-width="2" filter="url(#line-glow)"/> <!-- Vizag to Chennai -->
  <line x1="205" y1="440" x2="250" y2="455" stroke="#00E575" stroke-width="2" filter="url(#line-glow)"/> <!-- Bengaluru to Chennai -->
  <line x1="205" y1="440" x2="190" y2="495" stroke="#00E575" stroke-width="2" filter="url(#line-glow)"/> <!-- Bengaluru to Kochi -->
  <line x1="190" y1="495" x2="220" y2="540" stroke="#00E575" stroke-width="1.8"/> <!-- Kochi to Kanyakumari -->
  <line x1="250" y1="455" x2="220" y2="540" stroke="#00E575" stroke-width="1.8"/> <!-- Chennai to South -->

  <!-- Constellation Nodes (Major Cities) -->
  <!-- 1. JAIPUR (HQ HUB) - Highlighted with Double Pulse Beacon -->
  <circle cx="180" cy="190" r="14" fill="#00E575" fill-opacity="0.2" filter="url(#emerald-beacon)"/>
  <circle cx="180" cy="190" r="7" fill="#00E575" stroke="#FFFFFF" stroke-width="1.5" filter="url(#emerald-beacon)"/>
  <circle cx="180" cy="190" r="3" fill="#FFFFFF"/>
  <text x="145" y="185" fill="#00E575" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800">JAIPUR HQ</text>

  <!-- 2. NEW DELHI -->
  <circle cx="215" cy="155" r="9" fill="#00E575" fill-opacity="0.3"/>
  <circle cx="215" cy="155" r="4.5" fill="#00E575" stroke="#FFFFFF" stroke-width="1"/>
  <text x="226" y="152" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700">DELHI NCR</text>

  <!-- 3. MUMBAI -->
  <circle cx="160" cy="310" r="10" fill="#00E575" fill-opacity="0.3"/>
  <circle cx="160" cy="310" r="5" fill="#00E575" stroke="#FFFFFF" stroke-width="1"/>
  <text x="110" y="314" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700">MUMBAI</text>

  <!-- 4. BENGALURU -->
  <circle cx="205" cy="440" r="10" fill="#00E575" fill-opacity="0.3"/>
  <circle cx="205" cy="440" r="5" fill="#00E575" stroke="#FFFFFF" stroke-width="1"/>
  <text x="140" y="444" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700">BENGALURU</text>

  <!-- 5. HYDERABAD -->
  <circle cx="230" cy="360" r="8" fill="#00E575" fill-opacity="0.3"/>
  <circle cx="230" cy="360" r="4.5" fill="#00E575" stroke="#FFFFFF" stroke-width="1"/>
  <text x="242" y="364" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700">HYDERABAD</text>

  <!-- 6. CHENNAI -->
  <circle cx="250" cy="455" r="8" fill="#00E575" fill-opacity="0.3"/>
  <circle cx="250" cy="455" r="4.5" fill="#00E575" stroke="#FFFFFF" stroke-width="1"/>
  <text x="262" y="459" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700">CHENNAI</text>

  <!-- 7. KOLKATA -->
  <circle cx="335" cy="265" r="8" fill="#00E575" fill-opacity="0.3"/>
  <circle cx="335" cy="265" r="4.5" fill="#00E575" stroke="#FFFFFF" stroke-width="1"/>
  <text x="347" y="269" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700">KOLKATA</text>

  <!-- 8. AHMEDABAD -->
  <circle cx="140" cy="255" r="7" fill="#00E575" fill-opacity="0.3"/>
  <circle cx="140" cy="255" r="4" fill="#00E575"/>
  <text x="75" y="259" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600">AHMEDABAD</text>

  <!-- 9. PUNE -->
  <circle cx="185" cy="335" r="6" fill="#00E575" fill-opacity="0.3"/>
  <circle cx="185" cy="335" r="3.5" fill="#00E575"/>
  <text x="195" y="338" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600">PUNE</text>

  <!-- 10. KOCHI -->
  <circle cx="190" cy="495" r="6" fill="#00E575" fill-opacity="0.3"/>
  <circle cx="190" cy="495" r="3.5" fill="#00E575"/>
  <text x="150" y="499" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600">KOCHI</text>

  <!-- 11. GUWAHATI -->
  <circle cx="395" cy="200" r="6" fill="#00E575" fill-opacity="0.3"/>
  <circle cx="395" cy="200" r="3.5" fill="#00E575"/>
  <text x="405" y="204" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600">GUWAHATI</text>

  <!-- 12. LUCKNOW & PATNA -->
  <circle cx="270" cy="185" r="5" fill="#00E575"/>
  <circle cx="315" cy="215" r="5" fill="#00E575"/>
  <circle cx="200" cy="115" r="5" fill="#00E575"/>
  <circle cx="230" cy="75" r="4" fill="#00E575"/>
  <circle cx="250" cy="245" r="4.5" fill="#00E575"/>
  <circle cx="265" cy="295" r="4.5" fill="#00E575"/>
  <circle cx="290" cy="330" r="4.5" fill="#00E575"/>
  <circle cx="255" cy="405" r="4.5" fill="#00E575"/>
  <circle cx="220" cy="540" r="4" fill="#00E575"/>

  <!-- Glowing Micro-Particles / Sensors across Subcontinent -->
  <circle cx="210" cy="230" r="2" fill="#00E575" fill-opacity="0.6"/>
  <circle cx="235" cy="210" r="1.5" fill="#00E575" fill-opacity="0.5"/>
  <circle cx="195" cy="280" r="2" fill="#00E575" fill-opacity="0.6"/>
  <circle cx="240" cy="315" r="1.5" fill="#00E575" fill-opacity="0.5"/>
  <circle cx="215" cy="380" r="2" fill="#00E575" fill-opacity="0.6"/>
  <circle cx="230" cy="480" r="2" fill="#00E575" fill-opacity="0.6"/>
  <circle cx="360" cy="240" r="2" fill="#00E575" fill-opacity="0.6"/>

  <!-- Legend at Bottom Right -->
  <g transform="translate(30, 560)">
    <circle cx="6" cy="6" r="4" fill="#00E575" filter="url(#emerald-beacon)"/>
    <text x="18" y="10" fill="#00E575" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">100Cr+ Hours Projected Coverage by 2035</text>
  </g>
</svg>